[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-backstage"
version = "0.1.1"
description = "Backstage Django admin theme: custom AdminSite, navigation, dashboard, and host-driven configuration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JatraTech" }]
dependencies = [
    "Django>=4.2",
    "pillow>=11",
]

[project.urls]
Repository = "https://github.com/JatraTech/django-backstage"

[project.optional-dependencies]
tinymce = ["django-tinymce>=5.0"]
all = ["django-tinymce>=5.0"]
test = [
    "pytest",
    "pytest-django",
    "django-tinymce>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "django-tinymce>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backstage = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
